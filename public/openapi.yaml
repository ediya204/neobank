openapi: 3.1.0
info:
  title: VA BaaS Partner API
  version: 1.7.0
  description: |
    Use this API to onboard customers and read customer accounts, balances, fund
    transactions, and system-generated conversion records. Customer-initiated
    deposits, withdrawals, and manual OTC orders are disabled. Operations manually
    records verified fiat receipts; once marked cleared, the service automatically
    converts USD to USDT on TRON.

    Authenticate every request with your Cloudflare Access Service Token. The API is
    limited to 120 requests per minute. When an IP/CIDR allowlist is enabled, requests
    must also originate from an active allowlist rule. A blocked source returns
    `403 api_ip_not_allowed`; exceeding the rate limit returns
    `429 rate_limit_exceeded` with `Retry-After`.

    JSON write bodies are limited to 16 KB and reject unknown fields. Application and
    integration write requests retain their endpoint-specific idempotency rules.

    Every request that reaches the API returns `X-Request-Id`. Include this identifier
    when contacting support; never include credentials or full request bodies.

    IP allowlist and webhook configuration use a Partner-request/Admin-approval
    workflow. Approved webhooks receive HMAC-SHA256 signed, Partner-scoped events.
    `application.status_changed` includes `kyc_url` when status is `kyc_link_ready`,
    and `va_account.activated` includes the activated VA account snapshot. The receiver
    can therefore persist each onboarding handoff without an immediate API read. Query
    APIs remain the source of truth for recovery and reconciliation. A
    `fund_transaction.status_changed` event includes the customer-visible transaction
    type, direction, asset, decimal amount, fee, net amount, network, references, and
    settlement state; a newly recorded deposit remains `submitted` / `pending` until
    the explicit clearing workflow completes.

    Resource identifiers are not authorization credentials. Partner sweep reads validate
    batch and customer ownership; unknown and out-of-scope IDs both return `404 not_found`
    to resist enumeration. Responses omit internal notes, operator identity, internal tenant
    keys, destination configuration versions, and delivery diagnostics.

    Treat customer names, application IDs, wallet addresses, amounts, and transaction hashes
    as sensitive financial data. Never log Access credentials or webhook signatures. For a
    webhook, compute
    `lowercase_hex(HMAC_SHA256(secret, timestamp + "." + rawBodyUtf8))`, strip the literal
    `v1=` prefix from `X-VA-Webhook-Signature`, and compare the supplied and computed hex
    values in constant time. Enforce a timestamp window, deduplicate by event ID, and re-read
    the resource API before applying state. `X-VA-Webhook-Key-Id` identifies the managed
    signing key; legacy deliveries use `v1`.

    Historical USDT activity may reference `TRON`, `ETHEREUM`, `SOLANA`, or `BSC`.
    New automatic fiat conversions credit USDT on TRON using the operations-managed
    net rate. Conversion records are read-only to partners.

    This document describes the Partner API only.
servers:
  - url: /api/v1
security:
  - cfAccessClientId: []
    cfAccessClientSecret: []
tags:
  - name: Customers
    description: Read customer profiles, VA account details, balances, and recent activity.
  - name: Applications
    description: Submit and track customer VA onboarding applications.
  - name: Reference
    description: Read the current reference data required to build valid requests.
  - name: Balances
    description: Read ledger, reserved, and available balances for a customer.
  - name: Transfers
    description: Read historical deposits and withdrawals.
  - name: OTC
    description: Read historical and system-generated conversion records.
  - name: Integration
    description: Request and inspect approved IP allowlist and webhook integration settings.
paths:
  /:
    get:
      summary: Get the API index
      description: Returns API metadata and the canonical integration links.
      operationId: getApiIndex
      responses:
        "200":
          description: Partner API index
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [name, version, status, description, links]
                properties:
                  name: { type: string, const: VA BaaS Partner API }
                  version: { type: string, const: 1.7.0 }
                  status: { type: string, const: ok }
                  description: { type: string }
                  links:
                    type: object
                    additionalProperties: false
                    required: [health, openapi, country_calling_codes, portal_guide]
                    properties:
                      health: { type: string, const: /api/v1/health }
                      openapi: { type: string, const: /api/v1/openapi.yaml }
                      country_calling_codes:
                        type: string
                        const: /api/v1/country-calling-codes
                      portal_guide: { type: string, const: /portal/api-guide }
  /health:
    get:
      summary: Check API availability
      description: Returns the current service status and server time.
      operationId: getHealth
      responses:
        "200":
          description: Service is available
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
                  time: { type: string, format: date-time }
  /country-calling-codes:
    get:
      tags: [Reference]
      summary: List supported country calling codes
      description: |
        Returns every currently supported country or territory and its E.164 calling
        code. Multiple entries can share one calling code. Use `calling_code` as
        `phone_country_code` when creating an application.

        This list is an operational country-level onboarding pre-screen. It does not
        replace customer, beneficial-owner, entity, SDN, or regional sanctions
        screening. Clients should refresh the list instead of hard-coding it.
      operationId: listCountryCallingCodes
      responses:
        "200":
          description: Supported country and calling-code reference data
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountryCallingCodeList" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /va-applications:
    get:
      tags: [Applications]
      summary: List onboarding applications
      description: Returns VA onboarding applications visible to the authenticated partner.
      operationId: listApplications
      parameters:
        - in: query
          name: status
          description: Return only applications in this onboarding status.
          schema: { $ref: "#/components/schemas/ApplicationStatus" }
        - in: query
          name: search
          description: Search by customer name, email address, application ID, or Partner customer ID.
          schema: { type: string, maxLength: 160 }
        - $ref: "#/components/parameters/PartnerCustomerIdQuery"
      responses:
        "200":
          description: Application list
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Application" }
    post:
      tags: [Applications]
      summary: Create an onboarding application
      description: |
        Starts VA onboarding for one customer. Provide the country calling code and
        national phone number as separate fields.
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplication" }
      responses:
        "201":
          description: Application submitted
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /va-applications/{applicationId}:
    get:
      tags: [Applications]
      summary: Get an onboarding application
      description: Returns the latest onboarding status, KYC link, and VA account details when available.
      operationId: getApplication
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application detail
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "404":
          $ref: "#/components/responses/NotFound"
  /va-applications/{applicationId}/resubmit:
    post:
      tags: [Applications]
      summary: Correct and resubmit an onboarding application
      description: |
        Replaces the Partner-editable customer details and starts a new review round.
        This action is allowed only while status is `changes_requested`. The application
        ID and Partner customer ID remain unchanged, while the onboarding stage returns
        to `submitted` for a full re-review.
      operationId: resubmitApplication
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResubmitApplication" }
      responses:
        "200":
          description: Application corrected and resubmitted
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      operationId: listCustomers
      description: |
        Returns customer details, onboarding status, VA account information, and
        available balances for the customer overview.
      parameters:
        - name: q
          in: query
          description: Case-insensitive customer name, application ID, or email search.
          schema: { type: string }
        - name: status
          in: query
          description: Exact onboarding status, or `all` to disable status filtering.
          schema: { type: string, default: all }
        - name: balance_state
          in: query
          description: Filter customers by non-zero ledger balance or reserved balance.
          schema:
            type: string
            enum: [all, with_balance, with_reserved]
            default: all
        - $ref: "#/components/parameters/PartnerCustomerIdQuery"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Customer overview list
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CustomerSummary" }
                  meta:
                    type: object
                    required: [count, total, page, limit, snapshot_at]
                    properties:
                      count: { type: integer }
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      snapshot_at: { type: string, format: date-time }
  /customers/{applicationId}:
    get:
      tags: [Customers]
      summary: Get a customer overview
      operationId: getCustomerOverview
      description: |
        Returns one customer's onboarding details, VA account, network-specific
        balances, fund transactions, and OTC orders. The path may contain either
        the generated application ID or the Partner customer UUID v4.
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Customer account and funds detail
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOverview" }
        "404":
          $ref: "#/components/responses/NotFound"
  /balances:
    get:
      tags: [Balances]
      summary: Get customer balances
      description: |
        Returns the customer's ledger, reserved, and available balances. USD uses a
        single fiat balance; USDT uses one independent balance per supported network.
      operationId: getBalances
      parameters:
        - in: query
          name: application_id
          required: false
          description: Application ID of the customer whose balances are requested.
          schema: { type: string }
        - $ref: "#/components/parameters/PartnerCustomerIdQuery"
      responses:
        "200":
          description: Ledger, reserved and available balances
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Balance" }
  /transactions:
    get:
      tags: [Transfers, OTC]
      summary: List unified transaction history
      operationId: listTransactions
      description: |
        Returns fiat and USDT deposits, historical withdrawals, OTC activity,
        conversion ledger projections, and completed per-customer USDT/TRON sweep
        debits in reverse chronological order.
      parameters:
        - in: query
          name: application_id
          description: Filter by customer application ID.
          schema: { type: string }
        - $ref: "#/components/parameters/PartnerCustomerIdQuery"
        - in: query
          name: category
          description: Filter by fund transactions, OTC orders, or both.
          schema:
            type: string
            enum: [all, fund, otc]
            default: all
        - in: query
          name: status
          description: Filter by transaction processing status.
          schema:
            type: string
            enum: [all, submitted, processing, completed, rejected, cancelled]
            default: all
        - in: query
          name: type
          description: Filter unified history by the exact displayed transaction type.
          schema:
            type: string
            enum: [all, fiat_deposit, usdt_deposit, fiat_withdrawal, usdt_withdrawal, fiat_conversion_debit, crypto_conversion_credit, usdt_sweep, otc]
            default: all
        - in: query
          name: wallet
          description: |
            Filter activity that affects the fiat or digital wallet. Matching OTC
            orders are included because they change both wallet balances.
          schema:
            type: string
            enum: [all, fiat, crypto]
            default: all
        - in: query
          name: network
          description: |
            Filter USDT fund activity, completed sweeps, and either USDT side of an
            OTC order by network. Sweep rows are available only for `TRON` or `all`.
          schema:
            type: string
            enum: [all, TRON, ETHEREUM, SOLANA, BSC]
            default: all
        - in: query
          name: date_from
          description: Include records created on or after this calendar date.
          schema: { type: string, format: date }
        - in: query
          name: date_to
          description: Include records created on or before this calendar date.
          schema: { type: string, format: date }
        - in: query
          name: page
          description: One-based page number.
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          description: |
            Records per page, up to 200. When omitted, the V1-compatible response
            returns up to 200 records.
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        "200":
          description: Unified transaction history
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TransactionHistoryItem" }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      total: { type: integer }
                      page: { type: integer }
                      limit: { type: integer }
                      total_pages: { type: integer }
        "422":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /sweep-batches:
    get:
      tags: [Transfers]
      summary: List backend USDT sweep batches
      operationId: listSweepBatches
      description: |
        Read-only reconciliation view of sweep batches belonging to this Partner.
        Locked and submitted amounts remain reserved and reduce available balance;
        completed batches are posted to the ledger, while cancelled batches release
        the reservation. This endpoint never initiates a sweep.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, locked, submitted, completed, cancelled]
            default: all
        - in: query
          name: application_id
          description: Return batches containing this Partner customer.
          schema: { type: string }
        - $ref: "#/components/parameters/PartnerCustomerIdQuery"
        - in: query
          name: page
          description: One-based page number.
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          description: Sweep batches per page, from 1 through 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Partner-owned sweep batches
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SweepBatch" }
                  meta:
                    type: object
                    additionalProperties: false
                    required: [total, page, limit, total_pages]
                    properties:
                      total: { type: integer, minimum: 0 }
                      page: { type: integer, minimum: 1 }
                      limit: { type: integer, minimum: 1, maximum: 100 }
                      total_pages:
                        type: integer
                        minimum: 0
                        description: Zero when the filtered result is empty.
        "422":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /sweep-batches/{batchId}:
    get:
      tags: [Transfers]
      summary: Get one backend USDT sweep batch
      operationId: getSweepBatch
      description: |
        Returns the current batch status and per-customer allocation only when the
        entire batch belongs to this Partner. Unknown and out-of-scope IDs both
        return 404 to prevent resource discovery.
      parameters:
        - in: path
          name: batchId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Partner-owned sweep batch
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SweepBatch" }
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /fund-transactions:
    get:
      tags: [Transfers]
      summary: List fund transactions
      description: Returns fiat and USDT deposit and withdrawal records.
      operationId: listFundTransactions
      parameters:
        - in: query
          name: application_id
          description: Filter by customer application ID.
          schema: { type: string }
        - $ref: "#/components/parameters/PartnerCustomerIdQuery"
        - in: query
          name: status
          description: Filter by transaction processing status.
          schema:
            type: string
            enum: [all, submitted, processing, completed, rejected, cancelled]
        - in: query
          name: direction
          description: Filter by direction. `deposit` means inbound; `withdrawal` means outbound.
          schema:
            type: string
            enum: [all, deposit, withdrawal]
        - in: query
          name: type
          description: Filter by a specific fiat or USDT transaction type.
          schema:
            type: string
            enum: [all, fiat_deposit, usdt_deposit, fiat_withdrawal, usdt_withdrawal]
        - in: query
          name: network
          description: Return USDT fund records on this network only.
          schema:
            type: string
            enum: [all, TRON, ETHEREUM, SOLANA, BSC]
      responses:
        "200":
          description: Inbound and outbound records
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/FundTransaction" }
  /fund-transactions/{transactionId}:
    get:
      tags: [Transfers]
      summary: Get a fund transaction
      operationId: getFundTransaction
      description: |
        Returns one deposit or withdrawal by the resource ID supplied by a webhook
        or a previous API response.
      parameters:
        - $ref: "#/components/parameters/FundTransactionId"
      responses:
        "200":
          description: Fund transaction detail
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundTransaction" }
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /otc-orders:
    get:
      tags: [OTC]
      summary: List OTC orders
      description: Returns USD/USDT OTC orders in reverse chronological order.
      operationId: listOtcOrders
      parameters:
        - in: query
          name: application_id
          description: Filter by customer application ID.
          schema: { type: string }
        - $ref: "#/components/parameters/PartnerCustomerIdQuery"
        - in: query
          name: status
          description: Filter by current or historical OTC order status. New orders complete immediately.
          schema:
            type: string
            enum: [all, submitted, processing, completed, rejected, cancelled]
        - in: query
          name: network
          description: Return orders whose USDT buy or sell side uses this network.
          schema:
            type: string
            enum: [all, TRON, ETHEREUM, SOLANA, BSC]
      responses:
        "200":
          description: OTC order list
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OtcOrder" }
  /otc-orders/{orderId}:
    get:
      tags: [OTC]
      summary: Get an OTC order
      operationId: getOtcOrder
      description: |
        Returns one OTC order by the resource ID supplied by a webhook or a previous
        API response.
      parameters:
        - $ref: "#/components/parameters/OtcOrderId"
      responses:
        "200":
          description: OTC order detail
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtcOrder" }
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api-integration:
    get:
      tags: [Integration]
      summary: Read API integration configuration
      description: |
        Returns pending and reviewed configuration requests, approved IP allowlist
        rules, approved webhook endpoints, credential metadata, and recent webhook
        delivery results including the stored JSON payload text. Cloudflare Access
        Client Secrets and the webhook signing secret are never returned.
      operationId: getApiIntegration
      responses:
        "200":
          description: Partner API integration state
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ApiIntegrationState" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api-integration/ip-allowlist-requests:
    post:
      tags: [Integration]
      summary: Request an IP allowlist change
      description: |
        Creates a pending add or remove request. Live traffic is not changed until
        VA operations approves the request.
      operationId: createIpAllowlistRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIpAllowlistRequest" }
      responses:
        "201":
          description: Request submitted for approval
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationRequestEnvelope" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api-integration/webhook-requests:
    post:
      tags: [Integration]
      summary: Request a webhook configuration change
      description: |
        Creates a pending webhook upsert or disable request. Only public HTTPS
        destinations and the predefined event types are accepted.
      operationId: createWebhookRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookRequest" }
      responses:
        "201":
          description: Request submitted for approval
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationRequestEnvelope" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api-integration/credential-rotation-requests:
    post:
      tags: [Integration]
      summary: Request a Cloudflare Access credential rotation
      description: |
        Creates a pending rotation request for the existing service token. Operations
        approval is required. After approval, retrieve the new Client Secret once in
        the Partner Portal with TOTP step-up verification. The secret is never
        returned by this machine API.
      operationId: createCredentialRotationRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCredentialRotationRequest" }
      responses:
        "201":
          description: Rotation request submitted for approval
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRotationRequestEnvelope" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api-integration/credential-rotation-requests/{requestId}:
    get:
      tags: [Integration]
      summary: Get a credential rotation request
      operationId: getCredentialRotationRequest
      parameters:
        - $ref: "#/components/parameters/IntegrationRequestId"
      responses:
        "200":
          description: Credential rotation request
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRotationRequestEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api-integration/credential-rotation-requests/{requestId}/cancel:
    post:
      tags: [Integration]
      summary: Cancel a pending credential rotation request
      operationId: cancelCredentialRotationRequest
      parameters:
        - $ref: "#/components/parameters/IntegrationRequestId"
      responses:
        "200":
          description: Rotation request cancelled
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialRotationRequestEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api-integration/webhook-signing-key-requests:
    post:
      tags: [Integration]
      summary: Request creation or rotation of a Webhook signing key
      description: |
        Creates a pending request. Operations approval generates an encrypted key
        without activating it. An authorized Partner Portal user retrieves the secret
        once with TOTP, configures the receiver, and activates the key explicitly.
        This machine API never returns the signing secret.
      operationId: createWebhookSigningKeyRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookSigningKeyRequest" }
      responses:
        "201":
          description: Signing-key request submitted for approval
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSigningKeyRequestEnvelope" }
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api-integration/webhook-signing-key-requests/{requestId}/cancel:
    post:
      tags: [Integration]
      summary: Cancel a pending Webhook signing-key request
      operationId: cancelWebhookSigningKeyRequest
      parameters:
        - $ref: "#/components/parameters/IntegrationRequestId"
      responses:
        "200":
          description: Signing-key request cancelled
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSigningKeyRequestEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api-integration/requests/{requestId}:
    get:
      tags: [Integration]
      summary: Get an integration request
      operationId: getApiIntegrationRequest
      description: |
        Returns one IP allowlist or webhook configuration request. This is also the
        target of the Location header returned when a request is created.
      parameters:
        - $ref: "#/components/parameters/IntegrationRequestId"
      responses:
        "200":
          description: Integration request detail
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationRequestEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api-integration/requests/{requestId}/cancel:
    post:
      tags: [Integration]
      summary: Cancel a pending integration request
      description: Only a request that is still pending can be cancelled.
      operationId: cancelApiIntegrationRequest
      parameters:
        - $ref: "#/components/parameters/IntegrationRequestId"
      responses:
        "200":
          description: Request cancelled
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationRequestEnvelope" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api-integration/webhook-test:
    post:
      tags: [Integration]
      summary: Queue a signed test webhook
      description: |
        Queues a PII-free test event for an approved active webhook. Use the
        delivery ID to correlate the result in `GET /api-integration`.
      operationId: createWebhookTest
      responses:
        "202":
          description: Test delivery queued
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WebhookDelivery" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    cfAccessClientId:
      type: apiKey
      in: header
      name: CF-Access-Client-Id
      description: Cloudflare Access Service Token client ID issued for this Partner API.
    cfAccessClientSecret:
      type: apiKey
      in: header
      name: CF-Access-Client-Secret
      description: Cloudflare Access Service Token client secret. Store it as a secret and never log it.
  parameters:
    ApplicationId:
      in: path
      name: applicationId
      required: true
      description: Generated application ID or the Partner's customer UUID v4.
      schema: { type: string }
    PartnerCustomerIdQuery:
      in: query
      name: partner_customer_id
      required: false
      description: |
        Exact lowercase Partner customer UUID v4. Supply either this parameter or
        application_id, never both.
      schema: { $ref: "#/components/schemas/PartnerCustomerId" }
    FundTransactionId:
      in: path
      name: transactionId
      required: true
      description: Fund transaction resource ID.
      schema: { type: string }
    OtcOrderId:
      in: path
      name: orderId
      required: true
      description: OTC order resource ID.
      schema: { type: string }
    IntegrationRequestId:
      in: path
      name: requestId
      required: true
      description: Pending API integration request ID.
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: |
        Use a globally unique key for each idempotent business operation. Retrying
        the same normalized request on the same endpoint returns the original
        record. Reusing a key on another financial endpoint or with different
        customer, onboarding version, amount, network, quote, or beneficiary data returns
        `409 idempotency_conflict`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
  headers:
    RequestId:
      description: API-generated request correlation ID. Include it in support requests.
      schema: { type: string, format: uuid }
    Location:
      description: Relative API path of the newly created resource.
      schema: { type: string }
  responses:
    Forbidden:
      description: Access policy, API IP allowlist, or operator/partner role boundary rejected the request
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Partner API rate limit exceeded; retry after the response Retry-After interval
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
        Retry-After:
          schema: { type: integer }
          description: Seconds before retrying
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        Invalid state, insufficient available balance, fee change, or an Idempotency-Key reused
        with a different normalized request (`idempotency_conflict`).
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: |
        Invalid input, including unsupported JSON properties (`unknown_fields`) or
        an application country code outside the current supported list
        (`unsupported_country_code`). OTC quote mismatch (`otc_quote_mismatch`) is
        returned when buy_amount does not equal sell_amount multiplied by exchange_rate.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: JSON request body exceeds 16 KB
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Partner API security configuration is unavailable and the request is rejected
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    WebhookEventType:
      type: string
      enum:
        - application.status_changed
        - va_account.activated
        - fund_transaction.status_changed
        - fiat_deposit.cleared_and_converted
        - usdt_sweep.locked
        - usdt_sweep.completed
        - usdt_sweep.cancelled
        - otc_order.status_changed
    KycLinkReadyWebhook:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, data]
      properties:
        event_id: { type: string }
        type: { type: string, const: application.status_changed }
        occurred_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: false
          required:
            [resource_type, resource_id, application_id, partner_customer_id,
             status, onboarding_stage, submission_round, application_version,
             action_required, kyc_url]
          properties:
            resource_type: { type: string, const: va_application }
            resource_id: { type: string }
            application_id: { type: string }
            partner_customer_id:
              type: [string, "null"]
              format: uuid
              description: Null only for legacy applications without a Partner mapping.
            status: { type: string, const: kyc_link_ready }
            onboarding_stage: { type: string, const: kyc_link_ready }
            submission_round: { type: integer, minimum: 1 }
            application_version: { type: integer, minimum: 1 }
            action_required: { type: "null" }
            kyc_url:
              type: string
              format: uri
              pattern: '^https://'
              description: Actionable Sumsub KYC URL for this application.
    ApplicationChangesRequestedWebhook:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, data]
      properties:
        event_id: { type: string }
        type: { type: string, const: application.status_changed }
        occurred_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: false
          required:
            [resource_type, resource_id, application_id, partner_customer_id,
             status, onboarding_stage, submission_round, application_version,
             action_required]
          properties:
            resource_type: { type: string, const: va_application }
            resource_id: { type: string }
            application_id: { type: string }
            partner_customer_id:
              type: [string, "null"]
              format: uuid
            status: { type: string, const: changes_requested }
            onboarding_stage:
              type: string
              enum: [submitted, kyc_link_ready, kyc_approved, va_processing]
            submission_round: { type: integer, minimum: 1 }
            application_version: { type: integer, minimum: 1 }
            action_required: { $ref: "#/components/schemas/ApplicationActionRequired" }
    VaAccountActivatedWebhook:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, data]
      properties:
        event_id: { type: string }
        type: { type: string, const: va_account.activated }
        occurred_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: false
          required:
            [resource_type, resource_id, application_id, partner_customer_id,
             status, va_account]
          properties:
            resource_type: { type: string, const: va_account }
            resource_id: { type: string }
            application_id: { type: string }
            partner_customer_id:
              type: [string, "null"]
              format: uuid
              description: Null only for legacy applications without a Partner mapping.
            status: { type: string, const: active }
            va_account: { $ref: "#/components/schemas/VaAccount" }
    FundTransactionStatusWebhook:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, data]
      properties:
        event_id: { type: string }
        type: { type: string, const: fund_transaction.status_changed }
        occurred_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: false
          required:
            [resource_type, resource_id, application_id, partner_customer_id,
             status, transaction_type, direction, asset, amount, fee_amount,
             net_amount, network, external_reference, transaction_reference,
             settlement_status]
          properties:
            resource_type: { type: string, const: fund_transaction }
            resource_id: { type: string }
            application_id: { type: string }
            partner_customer_id:
              type: [string, "null"]
              format: uuid
              description: Null only for legacy applications without a Partner mapping.
            status:
              type: string
              enum: [submitted, processing, completed, rejected, cancelled]
            transaction_type:
              type: string
              enum: [fiat_deposit, usdt_deposit, fiat_withdrawal, usdt_withdrawal]
            direction: { type: string, enum: [deposit, withdrawal] }
            asset: { type: string, enum: [USD, USDT] }
            amount: { type: string, pattern: '^-?\d+(\.\d+)?$' }
            fee_amount: { type: string, pattern: '^-?\d+(\.\d+)?$' }
            net_amount: { type: string, pattern: '^-?\d+(\.\d+)?$' }
            network:
              type: [string, "null"]
              enum: [TRON, ETHEREUM, SOLANA, BSC, null]
            external_reference: { type: [string, "null"] }
            transaction_reference: { type: [string, "null"] }
            settlement_status: { type: string, enum: [pending, cleared, exception] }
    FiatDepositClearedAndConvertedWebhook:
      type: object
      additionalProperties: false
      required: [event_id, type, occurred_at, data]
      properties:
        event_id: { type: string }
        type: { type: string, const: fiat_deposit.cleared_and_converted }
        occurred_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: false
          required:
            [resource_type, resource_id, application_id, partner_customer_id,
             status, transaction_type, direction, external_reference,
             transaction_reference, settlement_status, cleared_at, fiat_asset,
             fiat_amount, exchange_rate, exchange_rate_version, usdt_amount,
             usdt_net_amount, usdt_network, otc_order_id, otc_status]
          properties:
            resource_type: { type: string, const: fund_transaction }
            resource_id: { type: string }
            application_id: { type: string }
            partner_customer_id:
              type: [string, "null"]
              format: uuid
              description: Null only for legacy applications without a Partner mapping.
            status: { type: string, const: completed }
            transaction_type: { type: string, const: fiat_deposit }
            direction: { type: string, const: deposit }
            external_reference: { type: [string, "null"] }
            transaction_reference: { type: [string, "null"] }
            settlement_status: { type: string, const: cleared }
            cleared_at: { type: string, format: date-time }
            fiat_asset: { type: string, const: USD }
            fiat_amount: { type: string, pattern: '^-?\d+(\.\d+)?$' }
            exchange_rate: { type: string, pattern: '^\d+(\.\d+)?$' }
            exchange_rate_version: { type: integer, minimum: 1 }
            usdt_amount: { type: string, pattern: '^-?\d+(\.\d+)?$' }
            usdt_net_amount: { type: string, pattern: '^-?\d+(\.\d+)?$' }
            usdt_network: { type: string, const: TRON }
            otc_order_id: { type: string }
            otc_status: { type: string, const: completed }
    IntegrationRequestStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    CreateIpAllowlistRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action, cidr, reason]
          properties:
            action: { type: string, const: add }
            cidr:
              type: string
              minLength: 3
              maxLength: 64
              description: Public IPv4, IPv6, or CIDR source to add.
            label: { type: string, minLength: 1, maxLength: 120 }
            environment:
              type: string
              enum: [production, disaster_recovery, development]
              default: production
              description: |
                Descriptive egress purpose for Operations review. This does not
                create a separate API environment; every approved enabled rule
                applies to the current production API.
            reason: { type: string, minLength: 1, maxLength: 500 }
        - type: object
          additionalProperties: false
          required: [action, target_entry_id, reason]
          properties:
            action: { type: string, const: remove }
            target_entry_id:
              type: string
              description: Approved IP allowlist rule ID to remove.
            reason: { type: string, minLength: 1, maxLength: 500 }
    CreateWebhookRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action, endpoint_url, events, reason]
          properties:
            action: { type: string, const: upsert }
            endpoint_url:
              type: string
              format: uri
              pattern: '^https://'
              description: Public HTTPS webhook destination on port 443.
            events:
              type: array
              minItems: 1
              uniqueItems: true
              items: { $ref: "#/components/schemas/WebhookEventType" }
            reason: { type: string, minLength: 1, maxLength: 500 }
        - type: object
          additionalProperties: false
          required: [action, reason]
          properties:
            action: { type: string, const: disable }
            reason: { type: string, minLength: 1, maxLength: 500 }
    CreateCredentialRotationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        migration_window_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 48
          description: Hours that the previous Client Secret remains valid after approval.
    ApiCredential:
      type: object
      additionalProperties: false
      required:
        [id, provider, client_id, secret_version, duration, expires_at, status,
         reveal_status, secret_available, created_at, updated_at]
      properties:
        id: { type: string }
        provider: { type: string, const: cloudflare_access }
        client_id: { type: string }
        secret_version: { type: integer, minimum: 1 }
        duration: { type: string, examples: ["8760h"] }
        expires_at: { type: string, format: date-time }
        previous_secret_expires_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [active, expired, revoked] }
        reveal_status: { type: string, enum: [available, revealed, unavailable] }
        secret_available: { type: boolean }
        source_request_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        revealed_at: { type: [string, "null"], format: date-time }
    CredentialRotationRequest:
      type: object
      additionalProperties: false
      required:
        [id, kind, partner_key, reason, migration_window_hours, status,
         requested_by, requested_via, created_at, updated_at]
      properties:
        id: { type: string }
        kind: { type: string, const: credential_rotation }
        partner_key: { type: string, const: ethan }
        reason: { type: string }
        migration_window_hours: { type: integer, minimum: 1, maximum: 168 }
        status: { $ref: "#/components/schemas/IntegrationRequestStatus" }
        requested_by: { type: string, const: partner }
        requested_via: { type: string, enum: [portal, api] }
        review_note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
    CredentialRotationRequestEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/CredentialRotationRequest" }
    CreateWebhookSigningKeyRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        overlap_hours: { type: integer, minimum: 1, maximum: 168, default: 48 }
    WebhookSigningKeyRequest:
      type: object
      additionalProperties: false
      required:
        [id, kind, reason, overlap_hours, status, requested_by, requested_via,
         created_at, updated_at]
      properties:
        id: { type: string, pattern: '^whkr_[0-9a-f]{32}$' }
        kind: { type: string, const: webhook_signing_key }
        reason: { type: string }
        overlap_hours: { type: integer, minimum: 1, maximum: 168 }
        status: { $ref: "#/components/schemas/IntegrationRequestStatus" }
        requested_by: { type: string, const: partner }
        requested_via: { type: string, enum: [portal, api] }
        review_note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
    WebhookSigningKeyRequestEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/WebhookSigningKeyRequest" }
    WebhookSigningKey:
      type: object
      additionalProperties: false
      required:
        [id, key_id, secret_version, status, reveal_status, secret_available,
         overlap_hours, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^whsk_[0-9a-f]{32}$' }
        key_id: { type: string, pattern: '^whsk_[0-9a-f]{32}$' }
        secret_version: { type: integer, minimum: 1 }
        status: { type: string, enum: [available, active, retiring, revoked] }
        reveal_status: { type: string, enum: [available, revealed] }
        secret_available: { type: boolean }
        overlap_hours: { type: integer, minimum: 1, maximum: 168 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        revealed_at: { type: [string, "null"], format: date-time }
        activated_at: { type: [string, "null"], format: date-time }
        retiring_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
    IntegrationRequest:
      type: object
      additionalProperties: false
      required:
        [id, kind, partner_key, action, status, reason, requested_by, requested_via,
         created_at, updated_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [ip_allowlist, webhook] }
        partner_key: { type: string, const: ethan }
        action: { type: string, enum: [add, remove, upsert, disable] }
        status: { $ref: "#/components/schemas/IntegrationRequestStatus" }
        reason: { type: string }
        review_note: { type: [string, "null"] }
        target_entry_id: { type: [string, "null"] }
        cidr: { type: [string, "null"] }
        label: { type: [string, "null"] }
        environment:
          type: string
          enum: [production, disaster_recovery, development]
          description: Descriptive egress purpose; not an independent access boundary.
        endpoint_url: { type: [string, "null"], format: uri }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        requested_by: { type: string, const: partner }
        requested_via: { type: string, enum: [portal, api] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
    IntegrationRequestEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/IntegrationRequest" }
    IpAllowlistRule:
      type: object
      additionalProperties: false
      required: [id, cidr, label, enabled, environment, valid, created_at, updated_at]
      properties:
        id: { type: string }
        cidr: { type: string }
        label: { type: [string, "null"] }
        enabled: { type: boolean }
        environment:
          type: string
          enum: [production, disaster_recovery, development]
          description: Descriptive egress purpose; not an independent access boundary.
        valid: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookEndpoint:
      type: object
      additionalProperties: false
      required:
        [id, partner_key, endpoint_url, events, status, last_delivery_at,
         last_success_at, created_at, updated_at]
      properties:
        id: { type: string, const: ethan }
        partner_key: { type: string, const: ethan }
        endpoint_url: { type: [string, "null"], format: uri }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        status: { type: string, enum: [active, paused, disabled] }
        last_delivery_at: { type: [string, "null"], format: date-time }
        last_success_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookDelivery:
      type: object
      additionalProperties: false
      required:
        [id, endpoint_url, event_type, resource_type, resource_id, resource_status,
         status, attempt_count, payload_json, created_at]
      properties:
        id: { type: string }
        endpoint_url: { type: string, format: uri }
        event_type: { type: string }
        resource_type:
          type: string
          enum: [va_application, va_account, fund_transaction, otc_order, usdt_sweep_batch, webhook]
        resource_id: { type: string }
        application_id: { type: [string, "null"] }
        resource_status: { type: string }
        status:
          type: string
          enum: [pending, delivering, retry_scheduled, delivered, dead_letter, suppressed]
        response_status: { type: [integer, "null"] }
        payload_json:
          type: string
          contentMediaType: application/json
          description: |
            Exact JSON text stored and signed for this delivery. Parse the string as
            JSON before reading event fields and treat it as sensitive operational data.
        attempt_count: { type: integer, minimum: 0, maximum: 5 }
        next_attempt_at: { type: [string, "null"], format: date-time }
        last_attempt_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
    ApiIntegrationState:
      type: object
      additionalProperties: false
      required:
        [summary, requests, credentials, credential_rotation_requests,
         webhook_signing_keys, webhook_signing_key_requests,
         ip_allowlist, webhooks, deliveries, security]
      properties:
        summary:
          type: object
          additionalProperties: false
          required:
            [pending, approved_ip_rules, webhook_endpoints, api_credentials,
             failed_deliveries]
          properties:
            pending: { type: integer, minimum: 0 }
            approved_ip_rules: { type: integer, minimum: 0 }
            webhook_endpoints: { type: integer, minimum: 0 }
            api_credentials: { type: integer, minimum: 0 }
            failed_deliveries: { type: integer, minimum: 0 }
        requests:
          type: array
          items: { $ref: "#/components/schemas/IntegrationRequest" }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/ApiCredential" }
        credential_rotation_requests:
          type: array
          items: { $ref: "#/components/schemas/CredentialRotationRequest" }
        webhook_signing_keys:
          type: array
          items: { $ref: "#/components/schemas/WebhookSigningKey" }
        webhook_signing_key_requests:
          type: array
          items: { $ref: "#/components/schemas/WebhookSigningKeyRequest" }
        ip_allowlist:
          type: array
          items: { $ref: "#/components/schemas/IpAllowlistRule" }
        webhooks:
          type: array
          items: { $ref: "#/components/schemas/WebhookEndpoint" }
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        security:
          type: object
          additionalProperties: false
          required:
            [access_service_token_required, ip_allowlist_enabled, rate_limit,
             credential_management, webhook_signing_key_management]
          properties:
            access_service_token_required: { type: boolean, const: true }
            ip_allowlist_enabled: { type: boolean }
            rate_limit:
              type: object
              additionalProperties: false
              required: [enabled, limit, period_seconds]
              properties:
                enabled: { type: boolean, const: true }
                limit: { type: integer, const: 120 }
                period_seconds: { type: integer, const: 60 }
            credential_management:
              type: object
              additionalProperties: false
              required: [configured]
              properties:
                configured: { type: boolean }
            webhook_signing_key_management:
              type: object
              additionalProperties: false
              required:
                [configured, legacy_worker_secret_fallback, one_time_secret_reveal,
                 totp_step_up_required]
              properties:
                configured: { type: boolean }
                legacy_worker_secret_fallback: { type: boolean }
                one_time_secret_reveal: { type: boolean, const: true }
                totp_step_up_required: { type: boolean, const: true }
    ApplicationStatus:
      type: string
      enum: [submitted, kyc_link_ready, kyc_approved, va_processing, active, changes_requested]
    ApplicationStage:
      type: string
      enum: [submitted, kyc_link_ready, kyc_approved, va_processing, active]
    PartnerCustomerId:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Partner-owned customer ID in canonical lowercase UUID v4 format.
      examples: ["eb9c7fa8-eb8c-45f8-a838-e82033a5b1f4"]
    CountryCallingCode:
      type: object
      additionalProperties: false
      required: [iso2, country, country_zh, calling_code]
      properties:
        iso2:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-style two-letter country or territory identifier.
        country: { type: string, description: English display name. }
        country_zh: { type: string, description: Simplified Chinese display name. }
        calling_code:
          type: string
          pattern: '^\+\d{1,3}$'
          description: E.164 country calling code accepted as phone_country_code.
    CountryCallingCodePolicy:
      type: object
      additionalProperties: false
      required: [id, reviewed_at, excluded_iso2, scope, disclaimer]
      properties:
        id: { type: string, const: supported_country_calling_codes_v1 }
        reviewed_at: { type: string, format: date }
        excluded_iso2:
          type: array
          items: { type: string, enum: [CU, IR, KP] }
          minItems: 3
          maxItems: 3
          uniqueItems: true
        scope: { type: string, const: country_level_pre_screening }
        disclaimer: { type: string }
    CountryCallingCodeList:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CountryCallingCode" }
        meta:
          type: object
          additionalProperties: false
          required: [count, unique_calling_code_count, policy]
          properties:
            count: { type: integer, minimum: 1 }
            unique_calling_code_count: { type: integer, minimum: 1 }
            policy: { $ref: "#/components/schemas/CountryCallingCodePolicy" }
    CreateApplication:
      type: object
      additionalProperties: false
      required: [partner_customer_id, phone_country_code, phone_number, email, customer_name]
      examples:
        - partner_customer_id: "eb9c7fa8-eb8c-45f8-a838-e82033a5b1f4"
          phone_country_code: "+65"
          phone_number: "81234567"
          email: customer@example.com
          customer_name: Example Customer
      properties:
        partner_customer_id:
          $ref: "#/components/schemas/PartnerCustomerId"
        phone_country_code:
          type: string
          description: |
            E.164 country calling code, supplied separately from the phone number.
            It must match a `calling_code` currently returned by
            `GET /country-calling-codes`; otherwise the API returns
            `422 unsupported_country_code`.
          pattern: '^\+\d{1,3}$'
          examples: ["+65"]
        phone_number:
          type: string
          description: National phone number without the country calling code.
          minLength: 4
          maxLength: 24
          examples: ["81234567"]
        email:
          type: string
          description: Customer email address used for onboarding.
          format: email
          maxLength: 254
          examples: ["customer@example.com"]
        customer_name:
          type: string
          description: Customer's legal or account display name.
          maxLength: 160
          examples: ["Example Customer"]
    ResubmitApplication:
      type: object
      additionalProperties: false
      required:
        [phone_country_code, phone_number, email, customer_name, expected_version]
      properties:
        phone_country_code:
          type: string
          pattern: '^\+\d{1,3}$'
        phone_number: { type: string, minLength: 4, maxLength: 24 }
        email: { type: string, format: email, maxLength: 254 }
        customer_name: { type: string, minLength: 1, maxLength: 160 }
        expected_version:
          type: integer
          minimum: 1
          description: Latest `application_version` returned by the API.
        response_note:
          type: string
          minLength: 1
          maxLength: 500
    ApplicationActionRequired:
      type: object
      additionalProperties: false
      required: [type, reason_code, reason_message, required_fields, requested_at]
      properties:
        type: { type: string, const: resubmit }
        reason_code:
          type: string
          enum:
            [customer_information_incomplete, customer_information_mismatch,
             phone_unverifiable, email_unverifiable, kyc_documents_incomplete,
             kyc_documents_expired, kyc_retry_required, duplicate_customer,
             unsupported_customer_profile, other]
        reason_message: { type: string, minLength: 10, maxLength: 500 }
        required_fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [customer_name, phone_country_code, phone_number, email, kyc_documents]
        requested_at: { type: string, format: date-time }
    VaAccount:
      type: object
      required: [account_name, account_number, currency, swift_bic, bank_name, bank_address]
      properties:
        account_name:
          type: string
          description: Beneficiary name registered on the virtual account.
        account_number:
          type: string
          description: Virtual account number assigned to the customer.
        iban:
          type: [string, "null"]
          description: Optional IBAN assigned alongside the virtual account number when available.
        currency:
          type: string
          const: USD
          description: Currency accepted by the virtual account.
        swift_bic:
          type: string
          description: SWIFT/BIC code of the receiving bank.
        bank_name:
          type: string
          description: Name of the receiving bank.
        bank_address:
          type: string
          description: Address of the receiving bank.
    Application:
      type: object
      required:
        - application_id
        - partner_customer_id
        - phone_country_code
        - phone_number
        - email
        - customer_name
        - status
        - onboarding_stage
        - submission_round
        - application_version
        - last_submitted_at
        - action_required
        - kyc_url
        - va_account
        - created_at
        - updated_at
      examples:
        - application_id: app_example_001
          partner_customer_id: "eb9c7fa8-eb8c-45f8-a838-e82033a5b1f4"
          phone_country_code: "+65"
          phone_number: "81234567"
          email: customer@example.com
          customer_name: Example Customer
          status: submitted
          onboarding_stage: submitted
          submission_round: 1
          application_version: 1
          last_submitted_at: "2026-08-02T08:30:00.000Z"
          action_required: null
          kyc_url: null
          va_account: null
          created_at: "2026-08-02T08:30:00.000Z"
          updated_at: "2026-08-02T08:30:00.000Z"
      properties:
        application_id: { type: string }
        partner_customer_id:
          description: Null only for legacy customers awaiting Partner mapping.
          oneOf:
            - { $ref: "#/components/schemas/PartnerCustomerId" }
            - { type: "null" }
        phone_country_code: { type: string }
        phone_number: { type: string }
        email: { type: string, format: email }
        customer_name: { type: string }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        onboarding_stage: { $ref: "#/components/schemas/ApplicationStage" }
        submission_round: { type: integer, minimum: 1 }
        application_version: { type: integer, minimum: 1 }
        last_submitted_at: { type: string, format: date-time }
        action_required:
          oneOf:
            - { $ref: "#/components/schemas/ApplicationActionRequired" }
            - { type: "null" }
        kyc_url:
          type: [string, "null"]
          format: uri
          description: |
            Actionable KYC session URL. It is returned only while status is
            `kyc_link_ready`; all other statuses return null.
        va_account:
          oneOf:
            - { $ref: "#/components/schemas/VaAccount" }
            - { type: "null" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomerSummary:
      allOf:
        - { $ref: "#/components/schemas/Application" }
        - type: object
          required: [balances]
          properties:
            balances:
              type: array
              items: { $ref: "#/components/schemas/Balance" }
    CustomerOverview:
      type: object
      required: [customer, balances, fund_transactions, otc_orders]
      properties:
        customer: { $ref: "#/components/schemas/Application" }
        balances:
          type: array
          items: { $ref: "#/components/schemas/Balance" }
        fund_transactions:
          type: array
          items: { $ref: "#/components/schemas/FundTransaction" }
        otc_orders:
          type: array
          items: { $ref: "#/components/schemas/OtcOrder" }
    FundTransaction:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        partner_customer_id:
          oneOf:
            - { $ref: "#/components/schemas/PartnerCustomerId" }
            - { type: "null" }
        customer_name:
          type: string
          description: Customer display name included in list responses.
        type:
          type: string
          enum: [fiat_deposit, usdt_deposit, usdt_withdrawal, fiat_withdrawal]
        asset: { type: string }
        amount:
          type: string
          description: Total account debit for a withdrawal; credited amount for a deposit.
        fee_amount:
          type: string
          description: Fixed fee snapshot saved when a withdrawal is created; zero for deposits.
        net_amount:
          type: string
          description: Net delivery amount. For withdrawals, `amount - fee_amount`; for deposits, equal to `amount`.
        status:
          type: string
          enum: [submitted, processing, completed, rejected, cancelled]
        external_reference:
          type: [string, "null"]
          description: Optional partner-side request reference supplied when the record was created.
        transaction_reference:
          type: [string, "null"]
          description: Bank execution reference or blockchain Tx Hash assigned when a withdrawal is completed.
        settlement_status:
          type: string
          enum: [pending, cleared, exception]
          description: Settlement state of the deposit or withdrawal record.
        conversion_otc_id:
          type: [string, "null"]
          description: OTC order created when a cleared fiat deposit was converted automatically.
        network:
          type: [string, "null"]
          enum: [TRON, ETHEREUM, SOLANA, BSC, null]
        destination: { type: [string, "null"] }
        beneficiary_name: { type: [string, "null"] }
        beneficiary_address: { type: [string, "null"] }
        bank_name: { type: [string, "null"] }
        bank_account_number: { type: [string, "null"] }
        swift_bic: { type: [string, "null"] }
        bank_address: { type: [string, "null"] }
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    Balance:
      type: object
      description: USDT balances are returned as one independent row per network.
      required: [application_id, partner_customer_id, asset, network, ledger_balance, reserved, available_balance]
      examples:
        - application_id: app_example_001
          partner_customer_id: "eb9c7fa8-eb8c-45f8-a838-e82033a5b1f4"
          asset: USDT
          network: TRON
          ledger_balance: "1000.5"
          reserved: "250"
          available_balance: "750.5"
          asset_decimals: 6
      properties:
        application_id: { type: string }
        partner_customer_id:
          oneOf:
            - { $ref: "#/components/schemas/PartnerCustomerId" }
            - { type: "null" }
        asset: { type: string }
        network:
          description: Null for fiat; required balance bucket for USDT.
          type: [string, "null"]
          enum: [TRON, ETHEREUM, SOLANA, BSC, null]
        ledger_balance: { type: string }
        reserved: { type: string }
        available_balance: { type: string }
        asset_decimals: { type: integer }
    TransactionHistoryItem:
      type: object
      required:
        [id, application_id, category, type, direction, asset, amount, status, created_at]
      properties:
        id: { type: string }
        application_id: { type: string }
        partner_customer_id:
          oneOf:
            - { $ref: "#/components/schemas/PartnerCustomerId" }
            - { type: "null" }
        customer_name: { type: string }
        category: { type: string, enum: [fund, otc] }
        type:
          type: string
          enum:
            [fiat_deposit, usdt_deposit, fiat_withdrawal, usdt_withdrawal,
             fiat_conversion_debit, crypto_conversion_credit, usdt_sweep, otc]
        direction: { type: string, enum: [credit, debit, exchange] }
        asset: { type: string }
        amount: { type: string }
        net_amount:
          type: [string, "null"]
          description: Net delivery amount for a withdrawal; may be null for other transaction types.
        counter_asset: { type: [string, "null"] }
        counter_amount: { type: [string, "null"] }
        buy_amount: { type: [string, "null"] }
        net_buy_amount: { type: [string, "null"] }
        fee_amount: { type: [string, "null"] }
        fee_rate: { type: [string, "null"] }
        exchange_rate: { type: [string, "null"] }
        status:
          type: string
          enum: [submitted, processing, completed, rejected, cancelled]
        reference:
          type: [string, "null"]
          description: |
            Customer-visible execution reference for a fund transaction. Completed
            sweeps return the TRON Tx Hash. OTC orders return null because their
            processing reference is not partner-visible.
        external_reference: { type: [string, "null"] }
        transaction_reference: { type: [string, "null"] }
        settlement_status:
          type: [string, "null"]
          enum: [pending, cleared, exception, null]
        conversion_otc_id:
          type: [string, "null"]
          description: OTC order created when a fiat deposit was cleared and converted.
        ledger_entry_id:
          type: [string, "null"]
          description: Posted ledger entry for a conversion projection or completed sweep debit.
        sweep_batch_id:
          type: [string, "null"]
          description: Backend sweep batch related to a completed per-customer USDT/TRON debit.
        otc_order_id:
          type: [string, "null"]
          description: Related automatic-conversion OTC order.
        source_fund_transaction_id:
          type: [string, "null"]
          description: Original cleared fiat deposit related to an automatic conversion.
        destination: { type: [string, "null"] }
        network:
          type: [string, "null"]
          enum: [TRON, ETHEREUM, SOLANA, BSC, null]
        counter_network:
          description: OTC buy-side network when the counter asset is USDT.
          type: [string, "null"]
          enum: [TRON, ETHEREUM, SOLANA, BSC, null]
        beneficiary_name: { type: [string, "null"] }
        beneficiary_address: { type: [string, "null"] }
        bank_name: { type: [string, "null"] }
        bank_account_number: { type: [string, "null"] }
        swift_bic: { type: [string, "null"] }
        bank_address: { type: [string, "null"] }
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    SweepBatch:
      type: object
      required:
        [batch_id, status, network, asset, total_amount, destination_address,
         tx_hash, created_at, submitted_at, completed_at, cancelled_at, items]
      properties:
        batch_id: { type: string }
        status:
          type: string
          enum: [locked, submitted, completed, cancelled]
        network: { type: string, const: TRON }
        asset: { type: string, const: USDT }
        total_amount: { type: string }
        destination_address:
          type: string
          description: Destination address snapshot fixed when the batch was locked.
        tx_hash:
          type: [string, "null"]
          description: Null before chain submission and on a cancelled locked batch.
        created_at: { type: string, format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/SweepBatchItem" }
    SweepBatchItem:
      type: object
      required: [application_id, partner_customer_id, customer_name, amount, ledger_entry_id]
      properties:
        application_id: { type: string }
        partner_customer_id:
          oneOf:
            - { $ref: "#/components/schemas/PartnerCustomerId" }
            - { type: "null" }
        customer_name: { type: string }
        amount: { type: string }
        ledger_entry_id:
          type: [string, "null"]
          description: Null until the sweep batch is completed and posted.
    OtcOrder:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        partner_customer_id:
          oneOf:
            - { $ref: "#/components/schemas/PartnerCustomerId" }
            - { type: "null" }
        customer_name:
          type: string
          description: Customer display name included in list responses.
        sell_asset: { type: string }
        sell_network:
          type: [string, "null"]
          enum: [TRON, ETHEREUM, SOLANA, BSC, null]
        sell_amount: { type: string }
        buy_asset: { type: string }
        buy_network:
          type: [string, "null"]
          enum: [TRON, ETHEREUM, SOLANA, BSC, null]
        buy_amount: { type: string }
        exchange_rate: { type: string }
        fee_rate: { type: string, const: "0.5%" }
        fee_amount:
          type: string
          description: Gross buy amount multiplied by 0.5%, rounded half up to the buy asset's smallest unit.
        net_buy_amount: { type: string }
        status:
          type: string
          enum: [submitted, processing, completed, rejected, cancelled]
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
