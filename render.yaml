services:
  - type: web
    name: neobank
    runtime: go
    rootDir: server-go
    region: singapore
    plan: starter
    buildCommand: go build -trimpath -ldflags="-s -w" -o bin/neobank ./cmd/api
    startCommand: ./bin/neobank
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_BACKEND
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: neobank-postgres
          property: connectionString
      - key: EDGE_SHARED_SECRET
        sync: false
      - key: CUSTOMER_PASSWORD_PEPPER
        sync: false
      - key: CUSTOMER_PASSWORD_RESET_SECRET
        sync: false
      - key: CUSTOMER_TOTP_KEY
        sync: false
      - key: CUSTOMER_RECOVERY_PEPPER
        sync: false
      - key: ADMIN_PASSWORD_PEPPER
        sync: false
      - key: ADMIN_TOTP_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false
      - key: FASTFOREX_API_KEY
        sync: false
      - key: SUMSUB_ENABLED
        value: 'false'
      - key: SUMSUB_ACTIVATION_APPROVED
        value: 'false'
      - key: SUMSUB_BASE_URL
        value: https://api.sumsub.com
      - key: SUMSUB_MODE
        value: sandbox
      - key: SUMSUB_LEVEL_NAME
        value: neobank_individual_v1
      - key: SUMSUB_APP_TOKEN
        sync: false
      - key: SUMSUB_SECRET_KEY
        sync: false
      - key: SUMSUB_WEBHOOK_SECRET
        sync: false
      - key: CREGIS_BASE_URL
        value: https://t-wsmbuuhb.cregis.io
      - key: CREGIS_ENABLED
        sync: false
      - key: CREGIS_PROJECT_ID
        sync: false
      - key: CREGIS_PROJECT_SECRET
        sync: false
      - key: CREGIS_RELAY_URL
        sync: false
      - key: CREGIS_RELAY_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CUSTOMER_PORTAL_BASE_URL
        sync: false
      - key: TENANT_ID
        value: neobank
      - key: WITHDRAWAL_ACCOUNTING_ENABLED
        value: 'false'
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: 'false'
  - type: web
    name: neobank-core
    runtime: node
    rootDir: server
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neobank-postgres
          property: connectionString
      - key: CORE_EDGE_SHARED_SECRET
        sync: false
      - key: CORE_EDGE_AUTH_REQUIRED
        value: 'true'
      - key: CORE_ADMIN_USER_ID
        value: usr_neobank_admin
      - key: CORE_ORGANIZATION_ID
        value: org_neobank
      - key: NEOBANK_SOURCE_TENANT_ID
        value: neobank
      - key: WEB_ORIGIN
        value: https://portal.sscdigitalbank.com
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: 'false'
  - type: worker
    name: neobank-email-worker
    runtime: node
    rootDir: server
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run start:email-worker
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neobank-postgres
          property: connectionString
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: 'false'
      - key: CUSTOMER_PASSWORD_RESET_SECRET
        sync: false
      - key: EMAIL_WORKER_POLL_INTERVAL_MS
        value: '5000'
      - key: PORTAL_BASE_URL
        value: https://portal.sscdigitalbank.com
      - key: ZOHO_ACCOUNTS_BASE_URL
        value: https://accounts.zoho.com
      - key: ZOHO_MAIL_API_BASE_URL
        value: https://mail.zoho.com/api
      - key: ZOHO_OAUTH_CLIENT_ID
        sync: false
      - key: ZOHO_OAUTH_CLIENT_SECRET
        sync: false
      - key: ZOHO_OAUTH_REFRESH_TOKEN
        sync: false
      - key: ZOHO_MAIL_ACCOUNT_ID
        sync: false
      - key: ZOHO_MAIL_FROM_ADDRESS
        sync: false
  - type: worker
    name: neobank-financial-accounting-worker
    runtime: node
    rootDir: server
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run start:financial-accounting-worker
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neobank-postgres
          property: connectionString
      - key: CORE_ADMIN_USER_ID
        value: usr_neobank_admin
      - key: CORE_ORGANIZATION_ID
        value: org_neobank
      - key: NEOBANK_SOURCE_TENANT_ID
        value: neobank
      - key: DEPOSIT_ACCOUNTING_POLL_INTERVAL_MS
        value: '3000'
      - key: WITHDRAWAL_ACCOUNTING_POLL_INTERVAL_MS
        value: '3000'

databases:
  - name: neobank-postgres
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: '17'
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []
