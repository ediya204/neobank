services:
  - type: web
    name: neobank
    runtime: go
    rootDir: server-go
    region: singapore
    plan: starter
    buildCommand: go build -trimpath -ldflags="-s -w" -o bin/neobank ./cmd/api
    startCommand: ./bin/neobank
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_BACKEND
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: neobank-postgres
          property: connectionString
      - key: EDGE_SHARED_SECRET
        sync: false
      - key: CUSTOMER_PASSWORD_PEPPER
        sync: false
      - key: CUSTOMER_TOTP_KEY
        sync: false
      - key: CUSTOMER_RECOVERY_PEPPER
        sync: false
      - key: ADMIN_PASSWORD_PEPPER
        sync: false
      - key: ADMIN_TOTP_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false
      - key: FASTFOREX_API_KEY
        sync: false
      - key: CREGIS_BASE_URL
        value: https://t-wsmbuuhb.cregis.io
      - key: CREGIS_ENABLED
        sync: false
      - key: CREGIS_PROJECT_ID
        sync: false
      - key: CREGIS_PROJECT_SECRET
        sync: false
      - key: CREGIS_RELAY_URL
        sync: false
      - key: CREGIS_RELAY_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CUSTOMER_PORTAL_BASE_URL
        sync: false
      - key: TENANT_ID
        value: neobank
  - type: web
    name: neobank-core
    runtime: node
    rootDir: server
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neobank-postgres
          property: connectionString
      - key: CORE_EDGE_SHARED_SECRET
        sync: false
      - key: CORE_EDGE_AUTH_REQUIRED
        value: "true"
      - key: CORE_ADMIN_USER_ID
        value: usr_neobank_admin
      - key: CORE_ORGANIZATION_ID
        value: org_neobank
      - key: NEOBANK_SOURCE_TENANT_ID
        value: neobank
      - key: WEB_ORIGIN
        value: https://portal.sscdigitalbank.com

databases:
  - name: neobank-postgres
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: '17'
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []
