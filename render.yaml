services:
  - type: web
    name: neobank
    runtime: go
    rootDir: server-go
    region: singapore
    plan: starter
    buildCommand: go build -trimpath -ldflags="-s -w" -o bin/neobank ./cmd/api
    startCommand: ./bin/neobank
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_BACKEND
        value: d1
      - key: DATABASE_CUTOVER_COPY
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: neobank-postgres
          property: connectionString
      - key: D1_GATEWAY_URL
        sync: false
      - key: D1_GATEWAY_SECRET
        sync: false
      - key: EDGE_SHARED_SECRET
        sync: false
      - key: CUSTOMER_PASSWORD_PEPPER
        sync: false
      - key: CUSTOMER_TOTP_KEY
        sync: false
      - key: CUSTOMER_RECOVERY_PEPPER
        sync: false
      - key: FASTFOREX_API_KEY
        sync: false
      - key: CREGIS_BASE_URL
        value: https://t-wsmbuuhb.cregis.io
      - key: CREGIS_ENABLED
        sync: false
      - key: CREGIS_PROJECT_ID
        sync: false
      - key: CREGIS_PROJECT_SECRET
        sync: false
      - key: CREGIS_RELAY_URL
        sync: false
      - key: CREGIS_RELAY_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CUSTOMER_PORTAL_BASE_URL
        sync: false
      - key: TENANT_ID
        value: neobank

databases:
  - name: neobank-postgres
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: '17'
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []
