services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: va_payment
      POSTGRES_USER: va_payment
      POSTGRES_PASSWORD: va_payment_local
    ports:
      - "5433:5432"
    volumes:
      - va_payment_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U va_payment -d va_payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - va_payment_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  va_payment_postgres:
  va_payment_redis:
